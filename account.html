<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- 
      This is an HTML comment
      You can write text in a comment and the content won't be visible in the page
    -->

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!--
      This is the page head - it contains info the browser uses
      Like the title, which appears on the browser tab but not inside the page
      Further down you'll see the content that displays in the page
    -->
    <title>NatWest Online – Bank Accounts, Mortgages, Loans and Savings</title>
    <link
      rel="shortcut icon"
      type="image/x-icon"
      href="https://www.natwest.com/apps/settings/wcm/designs/responsive_champion/clientlibs/resources/responsive_natwest_personal_favicon.ico"
    />

    <!-- The website stylesheet -->
    <link rel="stylesheet" href="/style_login.css" />

    <!-- The website JavaScript file -->
    <script src="/script.js"></script>
    <script
      type="text/javascript"
      src="https://assets.pingone.com/davinci/latest/davinci.js"></script>
  </head>
  <body>
    <div id="header">
      <div id="HeaderWrapper" class="HeaderWrapper">
        <div
          id="ctl00_header_ctl00_bottomHeaderLeftWrapper"
          class="bottomHeaderLeftWrapper"
        >
          <div id="ctl00_header_ctl00_nwHeader" class="nwHeader">
            <a
              id="headerLogo"
              href="https://www.natwest.com"
              target="_blank"
              rel="noopener noreferrer"
              ><img
                id="ctl00_header_ctl00_BrandImage4"
                srcset="
                  https://cdn.glitch.global/135f0b77-1383-4b56-a33b-17c73c8a0614/n-w-logo.svg?v=1712907217271
                "
                src="https://cdn.glitch.global/135f0b77-1383-4b56-a33b-17c73c8a0614/logo.png?v=1712907221334"
                alt="NatWest Logo - Back to home page "
                style="border-width: 0px"
            /></a>
          </div>
          <div
            id="ctl00_header_ctl00_globalBottomNavWrapper"
            class="globalBottomNavWrapper"
            style="display: none"
          >
            <ul class="globalBottomNav">
              <li>
                <a
                  id="ctl00_header_ctl00_HDRPULAAnchor"
                  title="Products : Opens in a new window"
                  rel="noopener noreferrer"
                  href="https://www.natwest.com/AOhome"
                  target="Products"
                  >Products</a
                >
              </li>
              <li>
                <a
                  id="ctl00_header_ctl00_HDRPULBAnchor"
                  title="Support : Opens in a new window"
                  rel="noopener noreferrer"
                  href="https://www.natwest.com/AOsupport"
                  target="Support"
                  >Support</a
                >
              </li>
              <li>
                <a
                  id="ctl00_header_ctl00_HDRPULCAnchor"
                  title="Life Moments : Opens in a new window"
                  rel="noopener noreferrer"
                  href="https://www.natwest.com/AOlifemoments"
                  target="Life Moments"
                  >Life Moments</a
                >
              </li>
            </ul>
          </div>
        </div>
        <div
          id="ctl00_header_ctl00_bottomHeaderRightWrapper"
          class="bottomHeaderRightWrapper"
        >
          <div
            id="ctl00_header_ctl00_quickLinksWrapper"
            class="showMeHowWrapper"
          >
            <ul id="Ul2" style="display: none">
              <li class="showMeHowLink">
                <a
                  id="ctl00_header_ctl00_HDRPULDAnchor"
                  title="Show me how to… : Opens in a new window"
                  rel="noopener noreferrer"
                  href="https://www.natwest.com/onlineguide"
                  target="helpwindow"
                  >Show me how to…</a
                >
              </li>
              <li class="last"></li>
            </ul>

            <div id="ctl00_header_ctl00_loginWrapper" class="loginWrapper">
              <div id="ctl00_header_ctl00_loginSpan" class="loginLink">
                <a
                  id="ctl00_header_ctl00_HDRNLAAnchor"
                  title="Log in"
                  href="https://www.onlinebanking.natwest.com/Login.aspx"
                  target="_top"
                  >Logout</a
                >
              </div>
            </div>
          </div>

          <div
            class="topHeaderRightWrapper showMeHowWrapper"
            style="display: none"
          >
            <div class="logoutWrapper" id="CancelButtonDiv">
              <div class="logoutLink cancelLink">
                <a
                  title="Cancel"
                  href="javascript:void(0)"
                  onclick="return goToLogin(event)"
                  id="HDRLink"
                  ><span id="ctl00_header_ctl00_HDRPULE">Cancel</span></a
                >
              </div>
            </div>

            <div class="logoutWrapper" id="OBCancelButtonDiv">
              <div class="logoutLink cancelLink">
                <a
                  id="ctl00_header_ctl00_OBCancelButtonAnchor"
                  title="Cancel"
                  href="https://www.onlinebanking.natwest.com/Login.aspx"
                  target="_top"
                  >Cancel</a
                >
              </div>
            </div>
          </div>
          <div class="headerwrappercontent bottomHeaderWrapper"></div>
        </div>
      </div>
    </div>
    <div id="content" class="li5MainContent">
      Hello world!
      </div>
  </body>
</html>
